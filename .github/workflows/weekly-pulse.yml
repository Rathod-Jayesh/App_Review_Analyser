name: Weekly Review Pulse

on:
  schedule:
    # 12:35 PM IST = 07:05 AM UTC (every Monday)
    - cron: "5 7 * * 1"

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      weeks:
        description: "Fetch reviews from last N weeks"
        required: false
        default: "8"
      max_reviews:
        description: "Max reviews to fetch"
        required: false
        default: "1000"

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
  EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

jobs:
  weekly-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full pipeline and send email
        run: |
          python cli.py run-all \
            --recipient "travelerjayesh@gmail.com" \
            --name "Jayesh" \
            --weeks ${{ github.event.inputs.weeks || '8' }} \
            --max-reviews ${{ github.event.inputs.max_reviews || '1000' }} \
            --send

      - name: Upload pulse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-${{ github.run_id }}
          path: |
            data/weekly-notes/pulse-*.md
            data/weekly-notes/pulse-*.txt
            data/weekly-notes/pulse-*.json
            data/weekly-notes/pulse-*.eml
          retention-days: 30
